name: dpfa
description: "Dew Point Fan"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+7

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.2
  intl: ^0.19.0
  theme_provider: ^0.6.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  icons_launcher: ^3.0.0

flutter:
  generate: true # needed for l10n generation
  uses-material-design: true

icons_launcher:
  image_path: 'assets/logo.png'
  platforms:
    android:
      enable: true
    ios:
      enable: true
    linux:
      enable: true
    web:
      enable: true
      favicon_path: 'assets/favicon.png'
    macos:
      enable: true
    windows:
      enable: true
